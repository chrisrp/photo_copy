[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2021"

# Dependencies (image decoding, hashing) are slow unoptimized; build them optimized
# even in dev so thumbnails stay responsive. Our own crates keep fast debug builds.
[profile.dev.package."*"]
opt-level = 3
